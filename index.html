<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Red Green Blue</title>
	<meta name="description" content="Red Green Blue is a production company. We make films and television.">
	<meta name="theme-color" content="#050505">
	<link rel="icon" href="favicon.ico">
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #050505;
			overflow: hidden;
		}

		/* Three light sources — red, green, blue — added together like light.
		   Where they overlap you get yellow, cyan, magenta, and white. */
		.stage {
			position: fixed;
			inset: 0;
			display: grid;
			place-items: center;
			isolation: isolate;
		}

		.orbit {
			position: absolute;
			width: 0;
			height: 0;
			mix-blend-mode: screen;
			animation: orbit var(--period) linear infinite;
			animation-delay: var(--delay);
		}

		.shape {
			position: absolute;
			width: 24vmin;
			height: 24vmin;
			left: -12vmin;
			top: -12vmin;
			border-radius: 22%;
			background: var(--color);
			filter: blur(0.3vmin);
			animation:
				drift var(--period) ease-in-out infinite alternate,
				spin calc(var(--period) * 1.7) linear infinite reverse;
			animation-delay: var(--delay);
		}

		.r { --color: #ff2a3d; --period: 9s;  --delay: 0s; }
		.g { --color: #22ff66; --period: 11s; --delay: -3.6s; }
		.b { --color: #2a3cff; --period: 13s; --delay: -8.1s; }

		@keyframes orbit {
			to { transform: rotate(360deg); }
		}

		@keyframes drift {
			0%   { translate: 5vmin 0;  scale: 0.92; }
			50%  { translate: 1.4vmin 0;  scale: 1.06; }
			100% { translate: 7.7vmin 0; scale: 0.96; }
		}

		@keyframes spin {
			to { rotate: 360deg; }
		}

		/* A faint glow behind everything so the colors feel lit, not flat. */
		.stage::before {
			content: "";
			position: absolute;
			width: 49vmin;
			height: 49vmin;
			border-radius: 50%;
			background: radial-gradient(closest-side, rgba(255,255,255,0.06), transparent);
			animation: breathe 6s ease-in-out infinite alternate;
		}

		@keyframes breathe {
			to { scale: 1.15; opacity: 0.6; }
		}

		.corner {
			position: fixed;
			bottom: max(28px, env(safe-area-inset-bottom));
			z-index: 1;
			margin: 0;
			display: flex;
			align-items: center;
			gap: 10px;
			font: 500 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif;
			letter-spacing: 0.18em;
			text-transform: uppercase;
			color: #6b6b6b;
			text-decoration: none;
			transition: color 0.3s ease;
		}

		.corner.left  { left: max(32px, env(safe-area-inset-left)); }
		.corner.right { right: max(32px, env(safe-area-inset-right)); }

		a.corner:hover,
		a.corner:focus-visible {
			color: #f5f5f5;
			outline: none;
		}

		.rec {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: #ff2a3d;
			box-shadow: 0 0 8px #ff2a3d;
			animation: rec 1.6s steps(1) infinite;
		}

		@keyframes rec {
			50% { opacity: 0; }
		}

		@media (max-width: 600px) {
			.corner { bottom: 20px; font-size: 10px; letter-spacing: 0.14em; gap: 8px; }
			.corner.left  { left: 16px; }
			.corner.right { right: 16px; }
		}

		@media (prefers-reduced-motion: reduce) {
			.orbit, .shape, .stage::before { animation-play-state: paused; }
			.rec { animation: none; }
		}
	</style>
</head>
<body>
	<main class="stage" role="img" aria-label="Red Green Blue">
		<div class="orbit r"><div class="shape"></div></div>
		<div class="orbit g"><div class="shape"></div></div>
		<div class="orbit b"><div class="shape"></div></div>
	</main>

	<p class="corner left"><span class="rec"></span><span>&copy; <span id="year">2026</span> Red Green Blue</span></p>
	<a class="corner right" href="mailto:contact@rdgnbl.com">contact@rdgnbl.com</a>

	<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
